# Python 포맷터·정적 분석 도구의 공통 설정입니다. / Shared configuration for Python quality tools.
[tool.black]
line-length = 80
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 80
known_first_party = ["app"]

[tool.pylint.main]
py-version = "3.10"

[tool.pylint.format]
max-line-length = 80

[tool.pylint.similarities]
# 짧은 선언부는 제외하고 16줄 이상의 구현 중복만 검사합니다.
min-similarity-lines = 16

[tool.mypy]
python_version = "3.10"
files = ["app"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true

[tool.pydocstyle]
convention = "google"
match-dir = "^(?!tests).*"
