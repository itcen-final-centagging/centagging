server {
  listen 8501;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # The application accepts images up to 10 MB. Keep enough room for
  # multipart/form-data metadata while rejecting unexpectedly large requests.
  client_max_body_size 20m;

  # 일부 Gemini 추천 요청은 기본 Nginx 제한 시간을 넘길 수 있습니다.
  proxy_connect_timeout 10s;
  proxy_send_timeout 300s;
  proxy_read_timeout 300s;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location = /health {
    proxy_pass http://api:8000/health;
  }

  location /api/ {
    proxy_pass http://api:8000/api/;
  }

  location /tagging {
    proxy_pass http://api:8000/tagging;
    proxy_http_version 1.1;
    # Gemini 추천 응답이 Nginx 기본 60초를 초과할 수 있습니다.
    proxy_read_timeout 10m;
    proxy_send_timeout 10m;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /ai-jobs {
    proxy_pass http://api:8000/ai-jobs;
  }

  location /history/results {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /approvals {
    proxy_pass http://api:8000/approvals;
  }

  location /product-image-submissions {
    proxy_pass http://api:8000/product-image-submissions;
  }

  location /sku {
    proxy_pass http://api:8000/sku;
  }

  location /search {
    proxy_pass http://api:8000/search;
  }

  location /uploads/ {
    proxy_pass http://api:8000/uploads/;
  }

  location /sku-images/ {
    proxy_pass http://api:8000/sku-images/;
  }

  location /auth/ {
    proxy_pass http://api:8000/auth/;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
