server {
  listen 8501;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # The application accepts images up to 10 MB. Keep enough room for
  # multipart/form-data metadata while rejecting unexpectedly large requests.
  client_max_body_size 20m;

  # The current tagging flow waits for the AI response in the same request.
  proxy_connect_timeout 10s;
  proxy_send_timeout 300s;
  proxy_read_timeout 300s;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location = /health {
    proxy_pass http://api:8000/health;
  }

  location /api/ {
    proxy_pass http://api:8000/api/;
  }

  location /tagging {
    proxy_pass http://api:8000/tagging;
  }

  location = /history/results {
    proxy_pass http://api:8000/history/results;
  }

  location /uploads/ {
    proxy_pass http://api:8000/uploads/;
  }

  location /sku-images/ {
    proxy_pass http://api:8000/sku-images/;
  }

  location /auth/ {
    proxy_pass http://api:8000/auth/;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
