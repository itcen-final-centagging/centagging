# API·프론트엔드·DB를 함께 실행하는 팀 공통 Docker Compose 설정입니다. / Shared Docker Compose configuration.
services:
  # PostgreSQL + PGVector 데이터베이스 / PostgreSQL + PGVector database
  db:
    # digest를 함께 고정해 같은 DB 이미지를 사용합니다. / The digest pins the exact same DB image.
    image: pgvector/pgvector:pg16@sha256:ad2e18408bf447f62092a8a5259e7df10505c5a0360bd1a1853ac8b8b0763da2
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-centagging}
      POSTGRES_USER: ${POSTGRES_USER:-centagging}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  # FastAPI 백엔드 / FastAPI backend
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      APP_ENV: ${APP_ENV:-local}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      MVP_LOGIN_ID: ${MVP_LOGIN_ID:-}
      MVP_LOGIN_PASSWORD: ${MVP_LOGIN_PASSWORD:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_VLM_MODEL: ${GEMINI_VLM_MODEL:-gemini-3.5-flash}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-2}
      IMAGE_STORAGE_ROOT: ${IMAGE_STORAGE_ROOT:-uploads}
      POSTGRES_DB: ${POSTGRES_DB:-centagging}
      POSTGRES_USER: ${POSTGRES_USER:-centagging}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./app:/app/app
      - ./uploads:/app/uploads
      - ./data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  # React 관리자 화면 / React admin interface
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "${FRONTEND_PORT:-8501}:8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8501/"]
      interval: 5s
      timeout: 5s
      retries: 10

# 로컬 DB 데이터를 유지하는 볼륨 / Volume that persists local database data
volumes:
  postgres_data:
