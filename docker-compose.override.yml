# Personal local override for Vertex AI ADC on Windows.
# This file is intentionally ignored by Git and is not shared with teammates.
services:
  api:
    environment:
      # Force ADC locally even if Windows or .env still contains API keys.
      VERTEX_API_KEY: ""
      GEMINI_API_KEY: ""
      GOOGLE_APPLICATION_CREDENTIALS: /gcp/application_default_credentials.json
    volumes:
      - ${APPDATA}/gcloud/application_default_credentials.json:/gcp/application_default_credentials.json:ro

  ai-worker:
    environment:
      # Force ADC locally even if Windows or .env still contains API keys.
      VERTEX_API_KEY: ""
      GEMINI_API_KEY: ""
      GOOGLE_APPLICATION_CREDENTIALS: /gcp/application_default_credentials.json
    volumes:
      - ${APPDATA}/gcloud/application_default_credentials.json:/gcp/application_default_credentials.json:ro
