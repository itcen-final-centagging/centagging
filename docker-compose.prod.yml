name: centagging

services:
  cloud-sql-proxy:
    image: ${CLOUD_SQL_PROXY_IMAGE:-gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.23.0@sha256:54e23cad9aeeedbf88ab75f993146631b878035f702b31c51885a932e0c7286c}
    command:
      - --private-ip
      - --address=0.0.0.0
      - --port=5432
      - --health-check
      - --http-address=0.0.0.0
      - --http-port=9090
      - ${CLOUD_SQL_INSTANCE_CONNECTION_NAME:?CLOUD_SQL_INSTANCE_CONNECTION_NAME must be set}
    healthcheck:
      test:
        [
          "CMD",
          "/cloud-sql-proxy",
          "wait",
          "--http-address=127.0.0.1",
          "--http-port=9090",
          "--max=2s",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - app_network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db-migrate:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    profiles: ["migration"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - ./docker/db/migrations:/migrations:ro
    depends_on:
      cloud-sql-proxy:
        condition: service_healthy
    networks:
      - app_network
    command:
      - psql
      - --set=ON_ERROR_STOP=1
      - --host=cloud-sql-proxy
      - --username=${POSTGRES_USER:?POSTGRES_USER must be set}
      - --dbname=${POSTGRES_DB:?POSTGRES_DB must be set}
      - --file=/migrations/create_ai_job.sql

  api:
    image: ${API_IMAGE:-centagging-api:prod}
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      APP_ENV: prod
      API_HOST: 0.0.0.0
      API_PORT: 8000
      MVP_LOGIN_ID: ${MVP_LOGIN_ID:?MVP_LOGIN_ID must be set}
      MVP_LOGIN_PASSWORD: ${MVP_LOGIN_PASSWORD:?MVP_LOGIN_PASSWORD must be set}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:?GCP_PROJECT_ID must be set}
      VERTEX_AI_LOCATION: ${VERTEX_AI_LOCATION:-global}
      GEMINI_VLM_MODEL: ${GEMINI_VLM_MODEL:-gemini-3.5-flash}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-2}
      IMAGE_STORAGE_ROOT: ${IMAGE_STORAGE_ROOT:-uploads}
      SKU_IMAGE_ROOT: ${SKU_IMAGE_ROOT:-data/images}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_HOST: cloud-sql-proxy
      POSTGRES_PORT: 5432
    volumes:
      - ${GCS_MOUNT_ROOT:?GCS_MOUNT_ROOT must be set}/uploads:/app/uploads
      - ${GCS_MOUNT_ROOT:?GCS_MOUNT_ROOT must be set}/sku-images:/app/data/images:ro
      - ./data/catalog:/app/data/catalog:ro
    depends_on:
      cloud-sql-proxy:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - app_network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ai-worker:
    image: ${API_IMAGE:-centagging-api:prod}
    build:
      context: .
      dockerfile: Dockerfile.api
    command: python -m app.workers.ai_job_worker
    environment:
      APP_ENV: prod
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:?GCP_PROJECT_ID must be set}
      VERTEX_AI_LOCATION: ${VERTEX_AI_LOCATION:-global}
      GEMINI_VLM_MODEL: ${GEMINI_VLM_MODEL:-gemini-3.5-flash}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-2}
      IMAGE_STORAGE_ROOT: ${IMAGE_STORAGE_ROOT:-uploads}
      SKU_IMAGE_ROOT: ${SKU_IMAGE_ROOT:-data/images}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_HOST: cloud-sql-proxy
      POSTGRES_PORT: 5432
    volumes:
      - ${GCS_MOUNT_ROOT:?GCS_MOUNT_ROOT must be set}/uploads:/app/uploads:ro
      - ${GCS_MOUNT_ROOT:?GCS_MOUNT_ROOT must be set}/sku-images:/app/data/images:ro
    depends_on:
      cloud-sql-proxy:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app_network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: ${FRONTEND_IMAGE:-centagging-frontend:prod}
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "${PUBLIC_HTTP_PORT:-80}:8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8501/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - app_network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  app_network:
    driver: bridge
