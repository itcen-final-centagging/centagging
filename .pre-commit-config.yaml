# 커밋 전 Python 코드 품질 검사를 실행하는 pre-commit 설정입니다. / Runs Python quality checks before commits.
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: black-check
        name: Black format check
        entry: black --check app crawl
        language: system
        pass_filenames: false
        always_run: true
      - id: isort-check
        name: isort import check
        entry: isort --check-only app crawl
        language: system
        pass_filenames: false
        always_run: true
      - id: pylint-check
        name: Pylint check
        entry: pylint app crawl
        language: system
        pass_filenames: false
        always_run: true
      - id: mypy-check
        name: mypy type check
        entry: mypy app crawl
        language: system
        pass_filenames: false
        always_run: true
      - id: pydocstyle-check
        name: pydocstyle check
        entry: pydocstyle app crawl
        language: system
        pass_filenames: false
        always_run: true
