# Stage 1 단독 실행용 compose.
# 두 앱을 함께 띄우려면 리포지토리 루트의 docker-compose.yml 을 사용하세요.
# API 키는 루트 .env 한 곳에서만 관리합니다.

services:
  embedding-poc-app:
    container_name: embedding-poc-app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    env_file:
      - ../.env
    restart: unless-stopped
