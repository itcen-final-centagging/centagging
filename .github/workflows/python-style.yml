# main·dev·deploy 대상 PR과 푸시에서 Python 코드 품질을 검사하는 GitHub Actions 설정입니다. / Checks Python style on main, dev, and deploy changes.
name: Python Style

on:
  pull_request:
    branches: [main, dev, deploy]
  push:
    branches: [main, dev, deploy]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-style:
    name: python-style
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.10.20
        uses: actions/setup-python@v6
        with:
          python-version: "3.10.20"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Check code formatting
        run: black --check app

      - name: Check import order
        run: isort --check-only app

      - name: Run Pylint
        run: pylint app

      - name: Run mypy
        run: mypy app

      - name: Check Google-style docstrings
        run: pydocstyle app
